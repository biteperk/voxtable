# Weekly dependency PRs, grouped so review cost stays sane: one PR for all
# minor/patch npm bumps, majors individually (they need real review), and one
# for GitHub Actions. Security advisories arrive regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    ignore:
      # Tailwind 4 is a breaking rewrite (new engine, CSS-first config), not a
      # bump — it needs the deliberate migration tracked in issue #155. This
      # stops dependabot re-opening the failing major PR every week; remove the
      # rule in the migration PR itself.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 3
