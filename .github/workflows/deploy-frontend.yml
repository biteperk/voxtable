name: Deploy frontend to Firebase

# CI builds the Firebase Hosting artifact first and uploads it to GCS. This
# workflow only downloads that artifact and deploys it:
# - integration -> staging Firebase environment
# - main -> production Firebase environment
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [integration, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      artifact_tag:
        description: Artifact tag to deploy. Required for manual deploys unless deploying production from the checked-out package version.
        required: false

concurrency:
  group: deploy-frontend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Hosting
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve Firebase Hosting artifact tag
        id: hosting-artifact
        env:
          DISPATCH_ARTIFACT_TAG: ${{ inputs.artifact_tag }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -n "$DISPATCH_ARTIFACT_TAG" ]; then
            ARTIFACT_TAG="$DISPATCH_ARTIFACT_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_ENVIRONMENT" = "production" ]; then
            ARTIFACT_TAG="$(node -p "require('./package.json').version")"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ARTIFACT_TAG="$SOURCE_SHA"
          elif [ "$SOURCE_BRANCH" = "main" ]; then
            ARTIFACT_TAG="$(node -p "require('./package.json').version")"
          else
            ARTIFACT_TAG="$SOURCE_SHA"
          fi

          if ! printf '%s' "$ARTIFACT_TAG" | grep -Eq '^[0-9A-Za-z._:+-]+$'; then
            echo "Invalid artifact tag: $ARTIFACT_TAG" >&2
            exit 1
          fi

          echo "artifact_tag=$ARTIFACT_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FRONTEND_DEPLOY_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || vars.VOXTABLE_PROJECT_ID }}
          FRONTEND_ARTIFACT_BUCKET: ${{ vars.FRONTEND_ARTIFACT_BUCKET }}
          GOOGLE_CLOUD_QUOTA_PROJECT: ${{ vars.GOOGLE_CLOUD_QUOTA_PROJECT || vars.PLATFORM_PROJECT_ID }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail

          : "${WORKLOAD_IDENTITY_PROVIDER:?Set GCP_WORKLOAD_IDENTITY_PROVIDER in the GitHub environment}"
          : "${FIREBASE_DEPLOY_SERVICE_ACCOUNT:?Set GCP_FRONTEND_DEPLOY_SERVICE_ACCOUNT or GCP_DEPLOY_SERVICE_ACCOUNT in the GitHub environment}"
          : "${FRONTEND_ARTIFACT_BUCKET:?Set FRONTEND_ARTIFACT_BUCKET in the GitHub environment}"
          : "${FIREBASE_PROJECT:?Set FIREBASE_PROJECT or VOXTABLE_PROJECT_ID in the GitHub environment}"
          : "${GOOGLE_CLOUD_QUOTA_PROJECT:?Set GOOGLE_CLOUD_QUOTA_PROJECT or PLATFORM_PROJECT_ID in the GitHub environment}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FRONTEND_DEPLOY_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT || vars.VOXTABLE_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.FIREBASE_PROJECT || vars.VOXTABLE_PROJECT_ID }}

      - name: Download Firebase Hosting artifact from GCS
        env:
          ARTIFACT_TAG: ${{ steps.hosting-artifact.outputs.artifact_tag }}
          FRONTEND_ARTIFACT_BUCKET: ${{ vars.FRONTEND_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail

          : "${FRONTEND_ARTIFACT_BUCKET:?Set FRONTEND_ARTIFACT_BUCKET in the GitHub environment}"

          gcloud storage cp "gs://${FRONTEND_ARTIFACT_BUCKET}/firebase-hosting/${ARTIFACT_TAG}.tgz" /tmp/frontend-hosting.tgz
          tar -xzf /tmp/frontend-hosting.tgz

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_APP_SITE: ${{ vars.FIREBASE_APP_SITE || vars.FIREBASE_PROJECT || vars.VOXTABLE_PROJECT_ID }}
          FIREBASE_KDS_SITE: ${{ vars.FIREBASE_KDS_SITE }}
          FIREBASE_ONLY: ${{ vars.FIREBASE_ONLY || 'hosting:app' }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || vars.VOXTABLE_PROJECT_ID }}
          GOOGLE_CLOUD_QUOTA_PROJECT: ${{ vars.GOOGLE_CLOUD_QUOTA_PROJECT || vars.PLATFORM_PROJECT_ID }}
        run: |
          set -euo pipefail

          : "${FIREBASE_APP_SITE:?Set FIREBASE_APP_SITE, FIREBASE_PROJECT, or VOXTABLE_PROJECT_ID in the GitHub environment}"

          node -e "
            const fs = require('fs');
            const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
            const project = process.env.FIREBASE_PROJECT;
            rc.projects = { ...rc.projects, default: project };
            rc.targets = {
              ...rc.targets,
              [project]: {
                ...(rc.targets && rc.targets[project]),
                hosting: {
                  ...((rc.targets && rc.targets[project] && rc.targets[project].hosting) || {}),
                  app: [process.env.FIREBASE_APP_SITE],
                },
              },
            };
            if (process.env.FIREBASE_KDS_SITE) {
              rc.targets[project].hosting.kds = [process.env.FIREBASE_KDS_SITE];
            }
            fs.writeFileSync('.firebaserc', JSON.stringify(rc, null, 2) + '\n');
          "

          npx --yes --package firebase-tools@15 firebase deploy --only "$FIREBASE_ONLY" --project "$FIREBASE_PROJECT" --non-interactive
