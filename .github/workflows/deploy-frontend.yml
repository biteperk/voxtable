name: Deploy frontend + KDS to Firebase

# CI builds the Firebase Hosting artifact first. This workflow only downloads
# that artifact and deploys it:
# - integration -> staging Firebase environment
# - main -> production Firebase environment
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [integration, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      source_run_id:
        description: Successful CI run ID that uploaded the frontend-hosting artifact
        required: true

concurrency:
  group: deploy-frontend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Hosting
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Download frontend hosting artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-hosting
          path: .
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/846797584634/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vocotable-497209.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_ONLY: ${{ vars.FIREBASE_ONLY || 'hosting' }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || 'vocotable' }}
          GOOGLE_CLOUD_QUOTA_PROJECT: ${{ vars.GOOGLE_CLOUD_QUOTA_PROJECT || 'vocotable' }}
        run: |
          set -euo pipefail
          npx --yes --package firebase-tools@15 firebase deploy --only "$FIREBASE_ONLY" --project "$FIREBASE_PROJECT" --non-interactive
