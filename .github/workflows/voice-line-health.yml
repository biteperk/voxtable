name: Voice line health

# Staging asserts the complete declared route, including the signed synthetic
# inbound probe. Production performs read-only Retell/Twilio configuration
# read-backs only; it never emits a synthetic webhook, call, booking or order.
#
# The numbers are read from the declaration at run time, not listed here. They were listed
# here once, and Cuban Corner's line — the newest, on a trunk configuration nothing else in
# the estate uses — went unmonitored from the day it was declared, because adding a line to
# the declaration silently did not add it to the check. The `coverage` job below fails if a
# declared line belongs to an environment no job handles, so the next one cannot slip either.
#
# It exists because none of that was checked by anything. On 20 Aug 2026 three of those
# layers were broken at once on production, had been for a day, and the detector was Sam
# placing a call. This runs off anyone's laptop so a break is found while it is still cheap.
on:
  schedule:
    # Daily, TEMPORARILY. Hourly is the right cadence and the intent is to restore it, but
    # neither job can run yet: staging needs a secretAccessor grant on three secrets
    # (biteperk-cloud-platform#31, awaiting apply) and production needs RETELL_PROD_API_KEY
    # and RETELL_PROD_WEBHOOK_SECRET as repository secrets. Twenty-four red runs a day for a
    # reason unrelated to the phone line is how a check becomes something people scroll past,
    # and this one exists precisely because nobody was watching.
    #
    # RESTORE TO "23 * * * *" once both are in place and a run comes back green.
    - cron: "23 19 * * *"
  workflow_dispatch:
  push:
    # A change to the declaration or the checker must prove itself immediately.
    #
    # integration/main ONLY, and not because feature branches do not matter: the workload
    # identity provider's attribute condition authorises those two refs and nothing else, so a
    # run from any other branch fails at auth before it reaches a single assertion. A workflow
    # that is red on every feature branch for a reason unrelated to what it checks is a workflow
    # people learn to scroll past.
    branches: [integration, main]
    paths:
      - deploy/voice-lines.json
      - .claude/skills/retell-agent-quality/scripts/assert-line.mjs
      - .github/workflows/voice-line-health.yml

concurrency:
  group: voice-line-health
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    # A declared line that no job asserts is worse than an undeclared one: it reads as covered.
    name: Every declared line has a job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/voice-lines-by-environment.mjs --assert-covered staging production

  staging:
    name: Staging line
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Assert every declared staging line
        run: |
          set -euo pipefail
          # The Retell credentials are resolved by the script from deploy/voice-lines.json,
          # so there is no second place for them to drift out of step with the declaration.
          # Only the Twilio pair is passed in, since assert-line takes those from the env.
          export TWILIO_AU1_KEY_SID=$(gcloud secrets versions access latest --secret=voxtable-stg-twilio-au1-key-sid --project=bp-voxtable-stg)
          export TWILIO_AU1_KEY_SECRET=$(gcloud secrets versions access latest --secret=voxtable-stg-twilio-au1-key-secret --project=bp-voxtable-stg)
          fail=0
          for number in $(node scripts/voice-lines-by-environment.mjs staging); do
            echo "::group::$number"
            node .claude/skills/retell-agent-quality/scripts/assert-line.mjs "$number" --strict || fail=1
            echo "::endgroup::"
          done
          exit $fail

  production:
    name: Production line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The workflow uses environment-scoped GitHub secrets for the external Retell probe.
      # The running application receives the corresponding values from bp-voxtable-prod
      # Secret Manager. The sandbox VM is not a credential source.
      - name: Read back every declared production line
        env:
          RETELL_API_KEY: ${{ secrets.RETELL_PROD_API_KEY }}
          RETELL_WEBHOOK_SECRET: ${{ secrets.RETELL_PROD_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RETELL_API_KEY:-}" ] || [ -z "${RETELL_WEBHOOK_SECRET:-}" ]; then
            echo "::error::Cannot check the production voice line — RETELL_PROD_API_KEY and/or"
            echo "::error::RETELL_PROD_WEBHOOK_SECRET are not set as repository secrets."
            echo "Mirror the bp-voxtable-prod Retell values into the production GitHub environment"
            echo "secrets used by this read-only monitor, or this line stays unmonitored."
            exit 1
          fi
          # Production policy prohibits the synthetic /retell/inbound layer. assert-line
          # automatically skips it for production and performs vendor configuration
          # read-backs only.
          #
          # No AU1 API key exists for the production Twilio account, so the trunk layer is
          # unverifiable. Deliberately not --strict here: the run would fail every hour on a
          # known, tracked gap and teach everyone to ignore it. assert-line still prints the
          # skip. Add --strict once voxtable-prod-twilio-au1-key-{sid,secret} exist.
          #
          # --use-env consumes the environment-scoped monitoring secrets. The script preflights
          # the key against the declared agent
          # first, so a secret pointing at the wrong workspace fails as a credential error
          # instead of reporting a healthy line as broken.
          #
          # Every production line runs on the SAME Retell workspace (Biteperk), so one pair of
          # secrets covers all of them. Looping keeps going after a failure: with two lines
          # live, stopping at the first would hide the state of the second.
          fail=0
          for number in $(node scripts/voice-lines-by-environment.mjs production); do
            echo "::group::$number"
            node .claude/skills/retell-agent-quality/scripts/assert-line.mjs "$number" --use-env || fail=1
            echo "::endgroup::"
          done
          exit $fail
