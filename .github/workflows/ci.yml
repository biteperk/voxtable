name: CI

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_IMAGE: australia-southeast1-docker.pkg.dev/bp-shared-artifacts/voxtable/api
  WORKER_IMAGE: australia-southeast1-docker.pkg.dev/bp-shared-artifacts/voxtable/worker

jobs:
  validate:
    name: Validate code and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DATABASE_SSL: "false"
      VITE_API_BASE_URL: http://localhost:3050
      VITE_GOOGLE_MAPS_KEY: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Apply migrations to a fresh database
        run: npm run db:migrate

      - name: Re-run migrations to verify idempotency
        run: npm run db:migrate

      - name: Run backend tests
        run: npm run test:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Build KDS
        run: npm run build:kds

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "package.json version must be semantic versioning, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        if: env.SHOULD_PUSH == 'true'
        with:
          workload_identity_provider: projects/846797584634/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vocotable-497209.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: env.SHOULD_PUSH == 'true'

      - name: Configure Artifact Registry auth
        if: env.SHOULD_PUSH == 'true'
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build api image
        run: |
          docker build -f Dockerfile.api -t vocotable-api:ci .
          if [ "$SHOULD_PUSH" = "true" ]; then
            docker tag vocotable-api:ci "$API_IMAGE:${{ steps.package-version.outputs.version }}"
            docker tag vocotable-api:ci "$API_IMAGE:v${{ steps.package-version.outputs.version }}"
            docker tag vocotable-api:ci "$API_IMAGE:latest"
            docker push "$API_IMAGE:${{ steps.package-version.outputs.version }}"
            docker push "$API_IMAGE:v${{ steps.package-version.outputs.version }}"
            docker push "$API_IMAGE:latest"
          fi

      - name: Build worker image
        run: |
          docker build -f Dockerfile.worker -t vocotable-worker:ci .
          if [ "$SHOULD_PUSH" = "true" ]; then
            docker tag vocotable-worker:ci "$WORKER_IMAGE:${{ steps.package-version.outputs.version }}"
            docker tag vocotable-worker:ci "$WORKER_IMAGE:v${{ steps.package-version.outputs.version }}"
            docker tag vocotable-worker:ci "$WORKER_IMAGE:latest"
            docker push "$WORKER_IMAGE:${{ steps.package-version.outputs.version }}"
            docker push "$WORKER_IMAGE:v${{ steps.package-version.outputs.version }}"
            docker push "$WORKER_IMAGE:latest"
          fi
