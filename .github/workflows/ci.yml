name: CI

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY_HOST: australia-southeast1-docker.pkg.dev
  API_IMAGE: australia-southeast1-docker.pkg.dev/bp-shared-artifacts/voxtable/api
  WORKER_IMAGE: australia-southeast1-docker.pkg.dev/bp-shared-artifacts/voxtable/worker

jobs:
  validate:
    name: Validate code and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DATABASE_SSL: "false"
      VITE_API_BASE_URL: http://localhost:3050
      VITE_GOOGLE_MAPS_KEY: ""
      # Placeholders. This job only proves the code compiles, and the build now
      # refuses to run without a Firebase config (apps/frontend/vite.config.ts).
      # These are deliberately fake so nothing here can talk to a real project.
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:ciplaceholder"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # No --if-present. There was no `lint` script and no ESLint anywhere in
      # the repo, so `npm run lint --if-present` exited 0 silently on every run
      # and showed a green tick having executed nothing (issue #186). Without
      # the flag, deleting the script fails the build loudly instead.
      #
      # The ceiling in the script is a ratchet: 0 errors, and the current
      # warning count exactly. A new warning fails CI. Lower it as warnings are
      # burned down — never raise it.
      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build:backend

      - name: Apply migrations to a fresh database
        run: npm run db:migrate

      - name: Re-run migrations to verify idempotency
        run: npm run db:migrate

      - name: Run backend tests
        run: npm run test:backend

      # The product's core promise. This runs against the Postgres service
      # container above and exercises the real booking service, so it covers the
      # advisory lock, the availability query and the database constraint
      # together. Two bugs that reached production had no automated coverage at
      # all before this existed.
      - name: Prove double-booking is impossible
        run: npm run smoke:double-booking

      # A Retell tool-call retry must return the FIRST booking, never make a
      # second one. The old guard keyed on an LLM-supplied call_log_id that
      # Bella cannot know, so it never ran on the path that needed it: the
      # retry found a DIFFERENT free table and committed. The exclusion
      # constraint cannot catch that — different table_id, no overlap — so
      # only this test can.
      - name: Prove a retried tool call cannot book twice
        run: npm run smoke:retry-idempotency

      # Two restaurants, two numbers: each call must land on the venue that was
      # actually dialled. Both Twilio handlers used to write the default tenant
      # unconditionally, which is invisible with one customer and files every
      # venue's calls against restaurant #1 the moment there are two.
      - name: Prove calls are attributed to the right restaurant
        run: npm run smoke:tenant-attribution

      # The other half of that hop. Attribution proves number -> restaurant;
      # this proves restaurant -> AGENT, which is what actually broke on a live
      # call (18 Aug 2026): the venue resolved correctly and was then answered
      # by another venue's agent, hard-coded with that venue's name and owner.
      # The caller was told they had reached a different restaurant while the
      # booking landed against the right one, and nothing objected anywhere.
      - name: Prove each venue answers with its own agent
        run: npm run smoke:agent-routing

      # The two refusals Bella owes a caller: a licensed item (responsible
      # service of alcohol) and an item outside its serving window. Both guards
      # shipped with NO automated cover — they were exercised only by a human
      # phone battery, against props planted in the staging venue's menu. This
      # builds its own venue, so a real customer's menu never has to carry test
      # fixtures for us.
      - name: Prove the voice path refuses licensed and out-of-hours items
        run: npm run smoke:menu-guards

      # A capacity ceiling used to be reported as a TIME problem: a party of
      # twelve was told the requested time was unavailable and offered nine
      # alternative slots, none of which could ever help, because nothing in the
      # platform combines tables. Live the moment a venue's largest table is
      # smaller than a party that rings.
      - name: Prove a too-large party is told the real reason
        run: npm run smoke:capacity-ceiling

      # The calendar mirror's three divergence bugs: a moved booking that never
      # propagated, a cancel-racing-create that left a permanent ghost booking
      # on Cal.com, and a reconciler that could stamp a stranger's web booking
      # onto a voice reservation. Every asserted path short-circuits before the
      # network, so this needs no Cal.com credentials.
      - name: Prove the Cal.com mirror converges
        run: npm run smoke:calcom-mirror

      # /cal/webhook answers 200 on failure (a 5xx makes Cal.com retry forever),
      # so before this worker existed an inbound booking lost to a lock wait was
      # lost for good — nothing on our side retried it, and nothing on theirs.
      # The claim function had zero callers for six migrations.
      - name: Prove a failed inbound booking is retried, not lost
        run: npm run smoke:inbox-retry

      # The outbox retry policy's throw path: a throwing row must dead-letter
      # at the attempts ceiling, and a row whose executor aborts the batch
      # transaction must still get its retry recorded (per-row savepoints) —
      # the old behaviour was an infinite 2-second re-claim loop invisible to
      # the failed_at alert.
      - name: Prove throwing outbox rows dead-letter
        run: npm run smoke:outbox-deadletter

      # min_capacity is a seating preference, not a booking gate. A solo diner
      # at an empty restaurant must be seated even when every table has
      # min_capacity=2; a party bigger than the biggest table stays refused.
      - name: Prove a solo diner can book
        run: npm run smoke:solo-diner

      # Cross-process ops state (migration 028): the KDS heartbeat store and
      # Retell auth-failure window written by the api must be readable by the
      # alerter in the worker — module memory made both alerts structurally
      # unfirable. Also proves counter-bucket atomicity and the purge hooks.
      - name: Prove ops state crosses the process boundary
        run: npm run smoke:ops-state

      # The two alerts that watch outcomes instead of mechanisms: calls
      # arriving with zero bookings written, and a venue deep into configured
      # service with zero calls at all (dead number / broken SIP forward).
      - name: Prove the business-outcome alerts see what they watch
        run: npm run smoke:business-alerts

      # The core product's kill switch: with VOICE_BOOKING_ENABLED=false every
      # Retell tool must return a spoken refusal and write nothing — the
      # switch is only trustworthy if the refusal path provably cannot reach
      # booking state.
      - name: Prove the voice kill switch refuses and writes nothing
        run: npm run smoke:voice-kill-switch

      # The notification outbox claim leases the row (next_attempt_at pushed
      # forward), so a second worker replica or a send outliving one tick can
      # never send the same email/SMS twice. Two racing claimers + a late
      # claimer must partition the rows with no overlap.
      - name: Prove a claimed notification cannot be claimed again
        run: npm run smoke:notification-lease

      # Booking-lifecycle SMS: a voice booking enqueues exactly one guest
      # confirmation (a Retell retry never a second), web/Cal.com bookings and
      # notes-only edits stay silent, dashboard changes and cancels text the
      # guest, and every body stays single-segment GSM-7. The script injects
      # fake Twilio creds to open the enqueue gate; no worker runs, nothing
      # sends.
      - name: Prove booking SMS fire once, and only for the right changes
        run: npm run smoke:booking-sms

      # A person whose Firebase identity changes while their email does not —
      # account recreated, or email/password replaced by Google sign-in — used to
      # hit a bare 23505 on the users email index and receive HTTP 500 "Something
      # went wrong." on the one onboarding step they cannot skip.
      - name: Prove a changed identity gets an actionable error, not a dead end
        run: npm run smoke:identity-collision

      # A dish the kitchen has switched off must be refused, never swapped for a
      # cheaper one — a caller ordered Fish and Chips and was charged for Chips.
      - name: Prove an unavailable dish is refused, not substituted
        run: npm run smoke:menu-substitution

      # The voice agent's view of a payment: read from the primary (a replica
      # would tell a guest who just paid that it had not arrived), three states
      # not two (an in-flight payment is not a failed one), and announced once
      # even when two checks race.
      - name: Prove payment status is truthful and announced exactly once
        run: npm run smoke:payment-watch

      # Voice-order payment links: double-fire returns the SAME link (never a
      # second charge path), a paid webhook flips the order exactly once, a
      # refunded order can't be resurrected by a late replay, an order-payment
      # event never advances SaaS onboarding, and the kill switch gates link
      # creation while in-flight links keep reconciling. The Stripe gateway is
      # a counting fixture — no credentials needed.
      - name: Prove payment links replay, reconcile, and never cross into billing
        run: npm run smoke:payments

      # The multi-tenancy guarantee the whole product rests on: a member of
      # restaurant A can neither READ nor MUTATE restaurant B's rows by UUID.
      # Needs two tenants that own reservations, which the synthetic-venue seed
      # provides — it is idempotent and additive (fixed UUIDs, ON CONFLICT DO
      # NOTHING), so it is safe to apply to the fresh CI database.
      - name: Seed the synthetic tenants used by the isolation check
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/seeds/synthetic_test_restaurants.sql

      - name: Prove one tenant cannot read or write another's rows
        run: npm run smoke:isolation

      # The admin console re-enqueues failed provisioning jobs. It MUST reset
      # the row in place: a second row means buying a second Twilio number.
      # Runs entirely in a rolled-back transaction — nothing persists.
      - name: Prove admin re-enqueue never creates a second provisioning job
        run: npm run smoke:admin

      # The legal layer is evidence, not decoration: the agreement step cannot
      # be skipped, a hash that disagrees with the published manifest is
      # refused, an unpublished (SAMPLE-*) document set is refused, and the
      # ledger's append-only triggers reject UPDATE and DELETE.
      - name: Prove the agreement ledger refuses bad input and cannot be edited
        run: npm run smoke:legal

      - name: Build frontend
        run: npm run build:frontend

      - name: Build KDS
        run: npm run build:kds

      - name: Audit production dependencies
        run: npm run audit:production

  docker-images:
    name: Build, scan, and publish Docker images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
    env:
      PUSH_SHA_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration' }}
      PUSH_VERSION_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SHOULD_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "package.json version must be semantic versioning, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          workload_identity_provider: projects/194287509090/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: registry@bp-shared-artifacts.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        if: env.SHOULD_PUSH == 'true'

      - name: Configure Artifact Registry auth
        if: env.SHOULD_PUSH == 'true'
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build api image
        run: docker build -f Dockerfile.api -t voxtable-api:ci .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t voxtable-worker:ci .

      # A built image is not a working image: on 1 Aug 2026 a green pipeline
      # shipped containers that died on their first line (CommonJS output run
      # as ESM), because nothing ever executed a file out of dist/. This step
      # loads the real module graph inside each freshly built image — if the
      # compiled output can't run, CI fails here instead of production.
      - name: Boot-check compiled images
        run: |
          docker run --rm -e APP_ENV=test -e DATABASE_URL=postgres://test:test@localhost:5432/test voxtable-api:ci node apps/backend/dist/bootCheck.js
          docker run --rm -e APP_ENV=test -e DATABASE_URL=postgres://test:test@localhost:5432/test voxtable-worker:ci node apps/backend/dist/bootCheck.js

      - name: Scan api image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voxtable-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voxtable-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push commit hash images from integration
        if: env.PUSH_SHA_IMAGES == 'true'
        run: |
          docker tag voxtable-api:ci "$API_IMAGE:${{ github.sha }}"
          docker tag voxtable-worker:ci "$WORKER_IMAGE:${{ github.sha }}"
          docker push "$API_IMAGE:${{ github.sha }}"
          docker push "$WORKER_IMAGE:${{ github.sha }}"

      - name: Push semantic version images from main
        if: env.PUSH_VERSION_IMAGES == 'true'
        run: |
          docker tag voxtable-api:ci "$API_IMAGE:${{ steps.package-version.outputs.version }}"
          docker tag voxtable-worker:ci "$WORKER_IMAGE:${{ steps.package-version.outputs.version }}"
          docker push "$API_IMAGE:${{ steps.package-version.outputs.version }}"
          docker push "$WORKER_IMAGE:${{ steps.package-version.outputs.version }}"

      - name: Tag release commit
        if: env.PUSH_VERSION_IMAGES == 'true'
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::Tag $VERSION already exists on origin — skipping. Bump the version in package.json when a release should get its own tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

  frontend-artifacts:
    name: Build frontend deploy artifact
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Every VITE_* value is now defined per GitHub Environment. There is
      # deliberately NO repository-level fallback: until 13 Aug 2026 there was
      # one, holding production's values, and because neither environment
      # overrode it BOTH staging and production builds silently inherited the
      # production API and the production Firebase project. Staging was not
      # isolated and nothing failed to say so. An absent variable must break the
      # build loudly, which is what the check below does.
      - name: Check this environment defines its own frontend config
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          missing=()
          for v in VITE_API_BASE_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                   VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                   VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::GitHub Environment '${DEPLOY_ENV}' does not define: ${missing[*]}" >&2
            echo "Add them to that environment's variables. Do NOT add a repository-level" >&2
            echo "fallback — a shared default is how staging ends up built against production." >&2
            exit 1
          fi
          echo "${DEPLOY_ENV} defines all required frontend config."

      - name: Build frontend + KDS
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Optional: absent → the dashboard renders no kitchen-display link.
          # Deliberately NOT in the required-config check above; a hardcoded
          # fallback in source is what shipped the production KDS link into
          # staging bundles (issue #260).
          VITE_KDS_URL: ${{ vars.VITE_KDS_URL }}
          VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          # Optional: activates Plausible in the build when the environment
          # defines it (production only). Deliberately NOT in the required-vars
          # check above — an environment without it builds with analytics off.
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
        run: |
          npm run build:frontend
          npm run build:kds

      # Config can look right and the artifact still be wrong, so assert on the
      # bundle that actually ships. A staging build carrying a production
      # hostname means staging traffic reaching production data — the failure
      # this whole separation exists to prevent.
      - name: Assert the bundle carries no other environment
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          EXPECT_API: ${{ vars.VITE_API_BASE_URL }}
          EXPECT_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        run: |
          set -euo pipefail

          # BOTH bundles are checked. The KDS ships in the same artifact and is
          # deployed alongside the dashboard, and it talks to the same API — so a
          # KDS built against the wrong environment is the identical failure,
          # just on the screen the kitchen stares at all service.
          bundles="apps/frontend/dist/assets apps/kds/dist/assets"

          # Match on authDomain, NOT the bare project id. `vocotable` appears in
          # every bundle regardless of environment — it is the immutable legacy
          # prefix on localStorage keys and window events (NAMES.md §4) — so a
          # bare project-id grep passes even on a staging bundle. authDomain is
          # unambiguous.
          expect_host="$(printf '%s' "$EXPECT_API" | sed -E 's#^https?://##; s#/.*$##')"

          # Markers belonging to the OTHER environment. Extend deliberately.
          # The two *.web.app hosts were added after a hardcoded production
          # KDS link shipped in staging bundles through this very list's gap
          # (issue #260) — the legacy Firebase Hosting names are production's.
          if [ "$DEPLOY_ENV" = "staging" ]; then
            forbidden="vocotable.algorythmos.com.au api.biteperk.com.au vocotable.firebaseapp.com vocotable.web.app vocotable-kds.web.app"
          else
            forbidden="voxtable-stg-api bp-voxtable-stg"
          fi

          for bundle_dir in $bundles; do
            [ -d "$bundle_dir" ] || { echo "::error::no bundle at $bundle_dir — did the build step run?" >&2; exit 1; }

            grep -rqF "$expect_host"        "$bundle_dir" || { echo "::error::${bundle_dir} does not reference the ${DEPLOY_ENV} API ${expect_host}" >&2; exit 1; }
            grep -rqF "$EXPECT_AUTH_DOMAIN" "$bundle_dir" || { echo "::error::${bundle_dir} does not reference the ${DEPLOY_ENV} Firebase auth domain ${EXPECT_AUTH_DOMAIN}" >&2; exit 1; }

            for marker in $forbidden; do
              if grep -rqF "$marker" "$bundle_dir"; then
                echo "::error::${DEPLOY_ENV} bundle ${bundle_dir} contains '${marker}', which belongs to the other environment." >&2
                echo "This build would send ${DEPLOY_ENV} traffic to the wrong place. Check that environment's VITE_* variables." >&2
                exit 1
              fi
            done
            echo "  ${bundle_dir}: references only ${DEPLOY_ENV}"
          done
          echo "${DEPLOY_ENV} bundles (dashboard + KDS) reference only ${DEPLOY_ENV}."

      - name: Resolve Firebase Hosting artifact tag
        id: hosting-artifact
        run: |
          set -euo pipefail

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ARTIFACT_TAG="$(node -p "require('./package.json').version")"
          else
            ARTIFACT_TAG="${{ github.sha }}"
          fi

          if ! printf '%s' "$ARTIFACT_TAG" | grep -Eq '^[0-9A-Za-z._:+-]+$'; then
            echo "Invalid artifact tag: $ARTIFACT_TAG" >&2
            exit 1
          fi

          echo "artifact_tag=$ARTIFACT_TAG" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/194287509090/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-frontend-artifacts@bp-shared-artifacts.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Upload Firebase Hosting artifact to GCS
        env:
          ARTIFACT_TAG: ${{ steps.hosting-artifact.outputs.artifact_tag }}
          FRONTEND_ARTIFACT_BUCKET: ${{ vars.FRONTEND_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail

          : "${FRONTEND_ARTIFACT_BUCKET:?Set FRONTEND_ARTIFACT_BUCKET in the GitHub environment}"

          tar -czf /tmp/frontend-hosting.tgz apps/frontend/dist apps/kds/dist
          gcloud storage cp /tmp/frontend-hosting.tgz "gs://${FRONTEND_ARTIFACT_BUCKET}/firebase-hosting/${ARTIFACT_TAG}.tgz"

  # Deploys are dispatched from here rather than chained with `workflow_run`.
  # A `workflow_run` run is attributed to the DEFAULT branch (integration), so
  # the production environment's branch policy (main only) rejected every
  # main-triggered deploy before a single step ran — four releases shipped no
  # dashboard or KDS and the runs list showed a three-second failure that looked
  # like nothing (issue #357). A `workflow_dispatch` carries the ref it is
  # dispatched from, so `--ref main` satisfies the policy and the deploy
  # workflows' own branch guard. GITHUB_TOKEN may start workflow_dispatch runs
  # (one of the two events exempt from the no-recursion rule). The deploy
  # workflows keep their own no-cancel concurrency groups, so a later CI run
  # cancelling this one cannot interrupt a deploy mid-upload.
  dispatch-deploys:
    name: Dispatch deploys
    runs-on: ubuntu-latest
    needs: [docker-images, frontend-artifacts]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main')
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch backend and frontend deploys for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          set -euo pipefail
          for wf in deploy-backend.yml deploy-frontend.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$REF_NAME" -f "environment=$DEPLOY_ENV"
            echo "dispatched $wf from $REF_NAME -> $DEPLOY_ENV"
          done
