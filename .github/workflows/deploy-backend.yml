name: Deploy backend to VM

# Push-to-main → build image in CI → push to Artifact Registry → VM pulls + restarts.
# The VM never builds or pulls source; it only `docker pull`s the prebuilt image.
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {} # lets us trigger a deploy by hand from the Actions tab

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never interrupt an in-flight prod deploy

# Keyless auth (WIF): these jobs must be allowed to mint a GitHub OIDC token.
permissions:
  contents: read
  id-token: write

env:
  API_IMAGE: us-central1-docker.pkg.dev/vocotable-497209/vocotable/api
  WORKER_IMAGE: us-central1-docker.pkg.dev/vocotable-497209/vocotable/worker

jobs:
  check:
    name: Build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check # tsc backend + vite build frontend + kds — blocks deploy if red

  build-push:
    name: Build & push images
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/846797584634/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vocotable-497209.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      # Two images since the api/worker split: same build stage, different
      # entrypoints. The api image also carries db/migrations (auto-migrate
      # runs inside it on the VM).
      - name: Build and push api (tag with git sha + latest)
        run: |
          docker build -f Dockerfile.api -t "$API_IMAGE:${{ github.sha }}" -t "$API_IMAGE:latest" .
          docker push "$API_IMAGE:${{ github.sha }}"
          docker push "$API_IMAGE:latest"
      - name: Build and push worker (tag with git sha + latest)
        run: |
          docker build -f Dockerfile.worker -t "$WORKER_IMAGE:${{ github.sha }}" -t "$WORKER_IMAGE:latest" .
          docker push "$WORKER_IMAGE:${{ github.sha }}"
          docker push "$WORKER_IMAGE:latest"

  deploy:
    name: Deploy on VM
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/846797584634/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vocotable-497209.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: SSH to VM — pull images, restart, migrate, healthcheck
        run: |
          gcloud compute ssh deployer@core-central-vm --zone=us-central1-a --quiet --command='
            set -e
            cd /opt/vocotable
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml pull api worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml up -d api worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api npm run db:migrate:prod
            sleep 5
            curl -fsS http://localhost:3050/health && echo " <- deploy healthy"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          '
