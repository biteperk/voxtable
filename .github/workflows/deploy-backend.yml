name: Deploy backend to Cloud Run

# CI builds, scans, and pushes images first. This workflow only deploys the
# image tag produced by the successful CI run:
# - integration -> staging, tagged with the commit SHA
# - main -> production, tagged with package.json semver
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [integration, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: Optional image tag to deploy. Defaults to commit SHA for staging and package.json version for production.
        required: false

concurrency:
  group: deploy-backend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY_HOST: australia-southeast1-docker.pkg.dev
  API_IMAGE: australia-southeast1-docker.pkg.dev/bp-shared-artifacts/voxtable/api
  WORKER_IMAGE: australia-southeast1-docker.pkg.dev/bp-shared-artifacts/voxtable/worker

jobs:
  deploy:
    name: Deploy backend
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deployment image tag
        id: deploy-meta
        env:
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_ENV="$DISPATCH_ENVIRONMENT"
          elif [ "$SOURCE_BRANCH" = "main" ]; then
            DEPLOY_ENV="production"
          elif [ "$SOURCE_BRANCH" = "integration" ]; then
            DEPLOY_ENV="staging"
          else
            echo "Unsupported deploy branch: $SOURCE_BRANCH" >&2
            exit 1
          fi

          if [ -n "$DISPATCH_IMAGE_TAG" ]; then
            IMAGE_TAG="$DISPATCH_IMAGE_TAG"
          elif [ "$DEPLOY_ENV" = "production" ]; then
            IMAGE_TAG="$(node -p "require('./package.json').version")"
          else
            IMAGE_TAG="$SOURCE_SHA"
          fi

          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9A-Za-z._:+-]+$'; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        env:
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail

          : "${WORKLOAD_IDENTITY_PROVIDER:?Set GCP_WORKLOAD_IDENTITY_PROVIDER in the GitHub environment}"
          : "${DEPLOY_SERVICE_ACCOUNT:?Set GCP_DEPLOY_SERVICE_ACCOUNT in the GitHub environment}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Cloud Run targets
        id: cloud-run
        env:
          API_SERVICE_OVERRIDE: ${{ vars.CLOUD_RUN_API_SERVICE }}
          DEPLOY_ENV: ${{ steps.deploy-meta.outputs.deploy_env }}
          JOB_OVERRIDE: ${{ vars.CLOUD_RUN_MIGRATION_JOB }}
          REGION: ${{ vars.GCP_DEFAULT_REGION || 'australia-southeast1' }}
          VOXTABLE_PROJECT_ID: ${{ vars.VOXTABLE_PROJECT_ID }}
          WORKER_SERVICE_OVERRIDE: ${{ vars.CLOUD_RUN_WORKER_SERVICE }}
        run: |
          set -euo pipefail

          : "${VOXTABLE_PROJECT_ID:?Set VOXTABLE_PROJECT_ID in the GitHub environment}"
          : "${REGION:?Set GCP_DEFAULT_REGION in the GitHub environment}"

          if [ "$DEPLOY_ENV" = "production" ]; then
            NAME_PREFIX="voxtable-prod"
          elif [ "$DEPLOY_ENV" = "staging" ]; then
            NAME_PREFIX="voxtable-stg"
          else
            echo "Unsupported deploy environment: $DEPLOY_ENV" >&2
            exit 1
          fi

          echo "project_id=$VOXTABLE_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "api_service=${API_SERVICE_OVERRIDE:-${NAME_PREFIX}-api}" >> "$GITHUB_OUTPUT"
          echo "worker_service=${WORKER_SERVICE_OVERRIDE:-${NAME_PREFIX}-worker}" >> "$GITHUB_OUTPUT"
          echo "migration_job=${JOB_OVERRIDE:-${NAME_PREFIX}-migrate}" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          IMAGE_TAG: ${{ steps.deploy-meta.outputs.image_tag }}
          MIGRATION_JOB: ${{ steps.cloud-run.outputs.migration_job }}
          PROJECT_ID: ${{ steps.cloud-run.outputs.project_id }}
          REGION: ${{ steps.cloud-run.outputs.region }}
        run: |
          set -euo pipefail

          gcloud run jobs update "$MIGRATION_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${API_IMAGE}:${IMAGE_TAG}" \
            --update-env-vars APP_ENV=migration,NODE_ENV=production \
            --remove-env-vars DASHBOARD_ALLOWED_EMAILS,DASHBOARD_MANAGER_EMAILS,PUBLIC_API_BASE_URL,RETELL_AGENT_ID,RETELL_VERIFY_SIGNATURE,TWILIO_PHONE_NUMBER,TWILIO_VALIDATE_SIGNATURE \
            --remove-secrets RETELL_API_KEY,RETELL_WEBHOOK_SECRET,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN \
            --command node \
            --args apps/backend/dist/db/migrate.js

          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait

      - name: Deploy Cloud Run services
        env:
          API_SERVICE: ${{ steps.cloud-run.outputs.api_service }}
          IMAGE_TAG: ${{ steps.deploy-meta.outputs.image_tag }}
          PROJECT_ID: ${{ steps.cloud-run.outputs.project_id }}
          REGION: ${{ steps.cloud-run.outputs.region }}
          WORKER_SERVICE: ${{ steps.cloud-run.outputs.worker_service }}
        run: |
          set -euo pipefail

          gcloud run services update "$API_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${API_IMAGE}:${IMAGE_TAG}"

          gcloud run services update "$WORKER_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${WORKER_IMAGE}:${IMAGE_TAG}"

      - name: Check API health
        env:
          API_SERVICE: ${{ steps.cloud-run.outputs.api_service }}
          PROJECT_ID: ${{ steps.cloud-run.outputs.project_id }}
          REGION: ${{ steps.cloud-run.outputs.region }}
        run: |
          set -euo pipefail

          API_URL="$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"

          curl -fsS "${API_URL}/health"
