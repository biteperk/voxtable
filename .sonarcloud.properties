# SonarCloud automatic-analysis configuration.
#
# The committed analysis standard lives in sonar-project.properties, but
# automatic analysis (no CI scanner) reads THIS file and ignores that one —
# which is why smoke scripts and runbook documents were being analysed and
# failing gates despite the committed scope saying otherwise. Keep the two
# files in agreement.
sonar.sources=apps/backend/src,apps/frontend/src,apps/kds/src
sonar.tests=apps/backend/src,apps/frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.js
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.min.js,apps/frontend/onboarding-preview/**,apps/backend/db/baseline-sydney/**
