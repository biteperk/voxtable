    <link rel="canonical" href="https://vocotable.biteperk.com.au" />

    <!--
      Static entity graph (in the initial HTML for reliable crawling —
      not runtime-injected). Ties this app to BitePerk's stable
      #organization @id and to the marketing product page, so the two
      properties consolidate into one brand entity.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://vocotable.biteperk.com.au/#website",
          "url": "https://vocotable.biteperk.com.au/",
          "name": "VocoTable",
          "publisher": { "@id": "https://biteperk.com.au/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://vocotable.biteperk.com.au/#app",
          "name": "VocoTable",
          "url": "https://vocotable.biteperk.com.au/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Phone",
          "description": "VocoTable is BitePerk's AI phone host for restaurants — Bella answers every call in a natural Australian voice and books the table, 24/7.",
          "publisher": { "@id": "https://biteperk.com.au/#organization" },
          "isPartOf": { "@id": "https://biteperk.com.au/products/#perk" },
          "sameAs": ["https://biteperk.com.au/products/perktable/"],
          "offers": {
            "@type": "Offer",
            "priceCurrency": "AUD",
            "price": "80",
            "url": "https://biteperk.com.au/products/perktable/",
            "availability": "https://schema.org/InStock"
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" type="image/avif" fetchpriority="high" imagesrcset="/bella/hero-portrait.avif 720w, /bella/hero-portrait@2x.avif 1080w" imagesizes="(max-width: 980px) 360px, 480px" />
    <style>
      @font-face {
        font-family: "Material Symbols Outlined";
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url("/fonts/material-symbols-outlined.woff2") format("woff2");
      }
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined" !important;
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Canonical-URL redirect: send anyone arriving at the .web.app or
      // .firebaseapp.com fallback domains to the branded subdomain. Runs
      // before React mounts so customers always see the right URL bar.
      (function () {
        var h = window.location.hostname;
        if (h === "vocotable.web.app" || h === "vocotable.firebaseapp.com") {
          window.location.replace(
            "https://vocotable.biteperk.com.au" +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
