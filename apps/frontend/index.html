<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VocoTable by Biteperk — AI that answers every restaurant call</title>
    <meta name="description" content="Biteperk builds VocoTable, the AI phone host for restaurants. Bella answers every call 24/7 in a natural Australian voice and books the table. Made in Sydney." />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VocoTable" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="canonical" href="https://vocotable.biteperk.com.au" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VocoTable by Biteperk — AI that answers every restaurant call" />
    <meta property="og:description" content="Bella answers every call 24/7 in a natural Australian voice and books the table. Made in Sydney." />
    <meta property="og:image" content="https://vocotable.biteperk.com.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://vocotable.biteperk.com.au" />
    <meta property="og:site_name" content="VocoTable by Biteperk" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://vocotable.biteperk.com.au/og-image.png" />
    <meta name="twitter:site" content="@biteperk" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" type="image/avif" fetchpriority="high" imagesrcset="/bella/hero-portrait.avif 720w, /bella/hero-portrait@2x.avif 1080w" imagesizes="(max-width: 980px) 360px, 480px" />
    <style>
      @font-face {
        font-family: "Material Symbols Outlined";
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url("/fonts/material-symbols-outlined.woff2") format("woff2");
      }
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined" !important;
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Canonical-URL redirect: send anyone arriving at the .web.app or
      // .firebaseapp.com fallback domains to the branded subdomain. Runs
      // before React mounts so customers always see the right URL bar.
      (function () {
        var h = window.location.hostname;
        if (h === "vocotable.web.app" || h === "vocotable.firebaseapp.com") {
          window.location.replace(
            "https://vocotable.biteperk.com.au" +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
