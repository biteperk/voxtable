# Sandbox production-posture override only. Production runs on Cloud Run and
# does not use Docker Compose.
services:
  api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-admin.json
    volumes:
      - ./firebase-admin.json:/secrets/firebase-admin.json:ro

  worker:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-admin.json
    volumes:
      - ./firebase-admin.json:/secrets/firebase-admin.json:ro
