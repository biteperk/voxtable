# =============================================================================
# VoxTable — Nginx Reverse Proxy Configuration
# =============================================================================
#
# Domains:   api.biteperk.com.au (canonical)
#            vocotable.algorythmos.com.au (legacy, still served — see
#            deploy/runbooks/domain-migration.md)
# Backend:   http://localhost:3050 (Docker container)
# SSL:       Let's Encrypt via Certbot (--cert-name api.biteperk.com.au)
#
# Install:
#   SANDBOX ONLY: core-central-vm is not a production origin. Its config is the regular file
#   /etc/nginx/sites-enabled/vocotable — NOT a symlink into sites-available.
#   Copying to sites-available/ there changes nothing: nginx loads both copies
#   and discards the second with "conflicting server name ... ignored".
#
#   sudo cp vocotable.conf /etc/nginx/sites-enabled/vocotable
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate is issued with `certonly`, so Certbot does not rewrite this
# file. It is maintained by hand.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones (applied before server blocks)
# ---------------------------------------------------------------------------
# General API rate limit: 20 requests/second per client IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Stricter rate limit for auth/booking endpoints: 5 requests/second per IP
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=5r/s;

# ---------------------------------------------------------------------------
# WebSocket upgrade mapping
# ---------------------------------------------------------------------------
# Sending a literal `Connection: upgrade` on every request defeats the
# `keepalive` directive on the upstream below, which requires `Connection: ""`
# on non-upgrade requests. This map emits it only for genuine upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Upstream definition for the backend API container
# ---------------------------------------------------------------------------
upstream vocotable_api {
    server 127.0.0.1:3050;

    # Keep connections alive to reduce TCP handshake overhead
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (port 80)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # Canonical hostname first, legacy second — both served from one cert so
    # the vendor-by-vendor cutover never has a gap. See
    # deploy/runbooks/domain-migration.md before changing this line.
    server_name api.biteperk.com.au vocotable.algorythmos.com.au;

    # Certbot ACME challenge directory — required for certificate issuance
    # and renewal. Must remain accessible over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server (port 443)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Canonical hostname first, legacy second — both served from one cert so
    # the vendor-by-vendor cutover never has a gap. See
    # deploy/runbooks/domain-migration.md before changing this line.
    server_name api.biteperk.com.au vocotable.algorythmos.com.au;

    # --- SSL certificates (managed by Certbot) ----------------------------
    # Issued with --cert-name api.biteperk.com.au covering BOTH server_names.
    ssl_certificate     /etc/letsencrypt/live/api.biteperk.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.biteperk.com.au/privkey.pem;

    # --- SSL protocol and cipher settings ----------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # SSL session caching for performance
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling is deliberately NOT enabled: Let's Encrypt no longer
    # publishes an OCSP responder URL in its certificates, so nginx ignores
    # `ssl_stapling on` and logs a warning on every reload.

    # --- Security headers --------------------------------------------------
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Prevent Nginx from disclosing its version
    server_tokens off;

    # --- Request body size limit -------------------------------------------
    # Webhooks from Twilio/RetellAI shouldn't exceed 10MB
    client_max_body_size 10m;

    # --- Logging -----------------------------------------------------------
    access_log /var/log/nginx/vocotable_access.log;
    error_log  /var/log/nginx/vocotable_error.log warn;

    # --- Gzip compression --------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # --- Health check (bypass rate limiting) --------------------------------
    location = /health {
        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- Webhook endpoints (Twilio + RetellAI) -----------------------------
    # Slightly relaxed rate limiting for provider webhooks
    location ~ ^/(retell|twilio)/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Webhooks need the raw body for signature verification
        proxy_request_buffering on;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Booking endpoints (stricter rate limiting) -------------------------
    location ~ ^/(bookings|availability)/ {
        limit_req zone=strict_limit burst=10 nodelay;

        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Default proxy (catch-all) ------------------------------------------
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;

        # WebSocket support (used by future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward real client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Buffer settings for upstream responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 8k;
    }

    # --- ACME challenge over HTTPS ------------------------------------------
    # `^~` is required here. The dotfile deny below is a REGEX location, and
    # nginx matches regex locations before plain prefix locations — without
    # `^~`, every /.well-known/ path would be swallowed by that deny.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Block dotfiles (e.g. .env, .git) -----------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }
}
