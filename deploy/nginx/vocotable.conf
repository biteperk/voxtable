# =============================================================================
# VocoTable — Nginx Reverse Proxy Configuration
# =============================================================================
#
# Domain:    api.vocotable.com
# Backend:   http://localhost:3050 (Docker container)
# SSL:       Let's Encrypt via Certbot
#
# Install:
#   sudo cp vocotable.conf /etc/nginx/sites-available/vocotable
#   sudo ln -s /etc/nginx/sites-available/vocotable /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot runs, it will modify this file to add its managed SSL blocks.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones (applied before server blocks)
# ---------------------------------------------------------------------------
# General API rate limit: 20 requests/second per client IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Stricter rate limit for auth/booking endpoints: 5 requests/second per IP
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=5r/s;

# ---------------------------------------------------------------------------
# Upstream definition for the backend API container
# ---------------------------------------------------------------------------
upstream vocotable_api {
    server 127.0.0.1:3050;

    # Keep connections alive to reduce TCP handshake overhead
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (port 80)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.vocotable.com;

    # Certbot ACME challenge directory — required for certificate issuance
    # and renewal. Must remain accessible over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server (port 443)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vocotable.com;

    # --- SSL certificates (managed by Certbot) ----------------------------
    ssl_certificate     /etc/letsencrypt/live/api.vocotable.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vocotable.com/privkey.pem;

    # --- SSL protocol and cipher settings ----------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # SSL session caching for performance
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling for faster TLS handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- Security headers --------------------------------------------------
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Prevent Nginx from disclosing its version
    server_tokens off;

    # --- Request body size limit -------------------------------------------
    # Webhooks from Twilio/RetellAI shouldn't exceed 10MB
    client_max_body_size 10m;

    # --- Logging -----------------------------------------------------------
    access_log /var/log/nginx/vocotable_access.log;
    error_log  /var/log/nginx/vocotable_error.log warn;

    # --- Gzip compression --------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # --- Health check (bypass rate limiting) --------------------------------
    location = /health {
        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- Webhook endpoints (Twilio + RetellAI) -----------------------------
    # Slightly relaxed rate limiting for provider webhooks
    location ~ ^/(retell|twilio)/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Webhooks need the raw body for signature verification
        proxy_request_buffering on;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Booking endpoints (stricter rate limiting) -------------------------
    location ~ ^/(bookings|availability)/ {
        limit_req zone=strict_limit burst=10 nodelay;

        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Default proxy (catch-all) ------------------------------------------
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://vocotable_api;
        proxy_http_version 1.1;

        # WebSocket support (used by future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Buffer settings for upstream responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 8k;
    }

    # --- Block dotfiles (e.g. .env, .git) -----------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }
}
