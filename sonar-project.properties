# SonarCloud configuration.
#
# This file exists so the quality bar lives in the repository rather than only
# in SonarCloud's web UI. Before it, the project key, what got analysed, and
# what counted as "new code" were all invisible to code review, unversioned,
# and changeable by anyone with dashboard access without leaving a trace.
# Now a change to the standard shows up in a pull request like anything else.

sonar.projectKey=biteperk_vocotable
sonar.organization=biteperk

# What to analyse. Only hand-written source — everything else is noise that
# makes the numbers meaningless.
sonar.sources=apps/backend/src,apps/frontend/src,apps/kds/src
sonar.tests=apps/backend/src,apps/frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.js

# Build output, dependencies and generated files. Analysing a minified bundle
# produces thousands of findings about code nobody wrote.
sonar.exclusions=\
  **/dist/**,\
  **/node_modules/**,\
  **/*.min.js,\
  apps/frontend/onboarding-preview/**,\
  apps/backend/db/baseline-sydney/**

# Coverage is not wired up yet — no lcov is produced, so leave the path unset
# rather than pointing at a file that does not exist.
#
# WORTH KNOWING BEFORE TURNING IT ON: Sonar's default gate wants 80% coverage
# on new code. Our tests are 84 cases across the pure-logic modules and nothing
# else. If coverage reporting is switched on while "new code" still means the
# whole repository, the gate fails on every file at once and blocks everyone.
# Fix the New Code definition first, then start the target somewhere honest.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
